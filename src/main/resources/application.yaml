spring:
  application:
    name: Todo

  datasource:
    url: jdbc:postgresql://localhost:5432/todo_db
    username: postgres
    password: postgres
#    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
#      ddl-auto: validate
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true
#    enabled: false
#    contexts: !test
    contexts: test
